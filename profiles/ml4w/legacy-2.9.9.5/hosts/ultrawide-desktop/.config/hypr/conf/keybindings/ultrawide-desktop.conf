# Named physical-key variation for the ultrawide desktop profile.
$mainMod = SHIFT CTRL
$HYPRSCRIPTS = ~/.config/hypr/scripts
$SCRIPTS = ~/.config/ml4w/scripts
$ML4WSETTINGS = qs -p ~/.local/share/ml4w-dotfiles-settings/quickshell ipc call settings toggle

# Applications
bind = $mainMod, T, exec, ~/.config/ml4w/settings/terminal.sh
bind = $mainMod, F, exec, ~/.config/ml4w/settings/browser.sh
bind = $mainMod, E, exec, ~/.config/ml4w/settings/filemanager.sh

# Windows
bind = ALT, F4, killactive
bind = $mainMod, F9, togglefloating
bind = $mainMod, F11, fullscreen
bind = $mainMod, J, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, I, movefocus, u
bind = $mainMod, K, movefocus, d
bindm = ALT, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = $mainMod ALT, L, resizeactive, 100 0
bind = $mainMod ALT, J, resizeactive, -100 0
bind = $mainMod ALT, K, resizeactive, 0 100
bind = $mainMod ALT, I, resizeactive, 0 -100

# Actions
bind = $mainMod SHIFT, A, exec, $HYPRSCRIPTS/toggle-animations.sh
bind = $mainMod, PRINT, exec, $HYPRSCRIPTS/screenshot.sh
bind = $mainMod CTRL, Q, exec, $SCRIPTS/wlogout.sh
bind = $mainMod, W, exec, waypaper
bind = $mainMod, RETURN, exec, pkill rofi || rofi -show drun -replace -i
bind = $mainMod SHIFT, B, exec, ~/.config/waybar/launch.sh
bind = $mainMod ALT, R, exec, $HYPRSCRIPTS/loadconfig.sh
bind = $mainMod, V, exec, $SCRIPTS/cliphist.sh
bind = $mainMod CTRL, S, exec, $ML4WSETTINGS

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8

bind = ALT $mainMod, 1, exec, $HYPRSCRIPTS/moveTo.sh 1
bind = ALT $mainMod, 2, exec, $HYPRSCRIPTS/moveTo.sh 2
bind = ALT $mainMod, 3, exec, $HYPRSCRIPTS/moveTo.sh 3
bind = ALT $mainMod, 4, exec, $HYPRSCRIPTS/moveTo.sh 4
bind = ALT $mainMod, 5, exec, $HYPRSCRIPTS/moveTo.sh 5
bind = ALT $mainMod, 6, exec, $HYPRSCRIPTS/moveTo.sh 6
bind = ALT $mainMod, 7, exec, $HYPRSCRIPTS/moveTo.sh 7
bind = ALT $mainMod, 8, exec, $HYPRSCRIPTS/moveTo.sh 8

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bind = $mainMod, N, workspace, empty

# Function keys
bind = , XF86MonBrightnessUp, exec, brightnessctl -q s +10%
bind = , XF86MonBrightnessDown, exec, brightnessctl -q s 10%-
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = $mainMod, F5, exec, quodlibet --play-pause
bind = $mainMod, F6, exec, quodlibet --prev
bind = $mainMod, F7, exec, quodlibet --next
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bind = , XF86Calculator, exec, ~/.config/ml4w/settings/calculator.sh
bind = , XF86Lock, exec, hyprlock
bind = , XF86Tools, exec, $ML4WSETTINGS

bind = , code:238, exec, brightnessctl -d tpacpi::kbd_backlight s +10
bind = , code:237, exec, brightnessctl -d tpacpi::kbd_backlight s 10-
