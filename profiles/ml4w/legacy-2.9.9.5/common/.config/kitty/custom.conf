# Loaded after the ML4W Kitty defaults and generated color configuration.
font_size 8
cursor_trail 0

# ML4W's generated palette can emit a green close enough to the foreground that
# it reads as uncolored, which hides added lines in git diff and every other
# ANSI green. Pin both green slots to kitty's own defaults; this file loads
# after the generated colors, so the override survives palette regeneration.
color2 #19cb00
color10 #23fd00
