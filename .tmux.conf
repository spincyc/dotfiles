# Portable tmux defaults.
set-option -g default-terminal "screen-256color"
set-option -as terminal-features ",xterm*:RGB"
set-option -g history-limit 50000
set-option -g mouse on
set-option -g base-index 1
set-window-option -g pane-base-index 1
set-window-option -g mode-keys emacs
set-option -g set-clipboard on
set-option -g renumber-windows on
# Let a program inside tmux hand an escape sequence tmux does not itself
# understand straight to the outer terminal, wrapped in a DCS passthrough:
# without it tmux swallows the inline-image and OSC sequences some
# terminals and TUIs rely on.
set-option -g allow-passthrough on

# Keep window and pane numbering predictable.
unbind-key -T prefix c
bind-key -T prefix c new-window -c "#{pane_current_path}"
unbind-key -T prefix n
bind-key -T prefix n new-window -c "#{pane_current_path}"
unbind-key -T prefix N
bind-key -T prefix N command-prompt -p "Window number:" "select-window -t ':%%'"
bind-key -T prefix '"' split-window -v -c "#{pane_current_path}"
bind-key -T prefix % split-window -h -c "#{pane_current_path}"

# Split panes by divider shape: | side by side, - stacked.
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# Move between panes without the prefix, right hand home row plus i for up.
bind-key -n M-j select-pane -L
bind-key -n M-k select-pane -D
bind-key -n M-i select-pane -U
bind-key -n M-l select-pane -R

# A pane in copy mode resolves keys against copy-mode and never falls back to
# the root table, so mirror the pane navigation there to keep it working.
bind-key -T copy-mode M-j select-pane -L
bind-key -T copy-mode M-k select-pane -D
bind-key -T copy-mode M-i select-pane -U
bind-key -T copy-mode M-l select-pane -R

# Copy mode and clipboard-friendly selections. The emacs table already carries
# C-a/C-e, C-Space, M-w, C-g, M-b/M-f, C-v/M-v, M-</M-> and incremental C-s/C-r,
# so only the i/j/k/l motion layout needs binding. A terminal sends 0x09 for
# ctrl+i and tmux resolves it to Tab unless extended keys are on, so bind both;
# C-j, C-k and C-l displace cursor-left, copy-end-of-line and recentre.
bind-key -n M-Space copy-mode
bind-key -T copy-mode C-j send-keys -X cursor-left
bind-key -T copy-mode C-k send-keys -X cursor-down
bind-key -T copy-mode C-i send-keys -X cursor-up
bind-key -T copy-mode Tab send-keys -X cursor-up
bind-key -T copy-mode C-l send-keys -X cursor-right
bind-key -T copy-mode v send-keys -X begin-selection
bind-key -T copy-mode y send-keys -X copy-selection-and-cancel
bind-key -n M-y paste-buffer

bind-key r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
