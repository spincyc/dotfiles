# Portable tmux defaults.
set-option -g default-terminal "screen-256color"
set-option -as terminal-features ",xterm*:RGB"
set-option -g history-limit 50000
set-option -g mouse on
set-option -g base-index 1
set-window-option -g pane-base-index 1
set-window-option -g mode-keys vi
set-option -g set-clipboard on
set-option -g renumber-windows on

# Keep window and pane numbering predictable.
bind-key c new-window -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"

# Move between panes without the prefix.
bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R

# Copy mode and clipboard-friendly selections.
bind-key -n M-Space copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -n M-y paste-buffer

bind-key r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
