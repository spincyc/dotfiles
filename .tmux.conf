# Portable tmux defaults.
set-option -g default-terminal "screen-256color"
set-option -as terminal-features ",xterm*:RGB"
set-option -g history-limit 50000
set-option -g mouse on
set-option -g base-index 1
set-window-option -g pane-base-index 1
set-window-option -g mode-keys vi
set-option -g set-clipboard on
set-option -g renumber-windows on

# Keep window and pane numbering predictable.
unbind-key -T prefix c
bind-key -T prefix c new-window -c "#{pane_current_path}"
unbind-key -T prefix n
bind-key -T prefix n new-window -c "#{pane_current_path}"
unbind-key -T prefix N
bind-key -T prefix N command-prompt -p "Window number:" "select-window -t ':%%'"
bind-key -T prefix '"' split-window -v -c "#{pane_current_path}"
bind-key -T prefix % split-window -h -c "#{pane_current_path}"

# Split panes by divider shape: | side by side, - stacked.
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# Move between panes without the prefix, right hand home row plus i for up.
bind-key -n M-j select-pane -L
bind-key -n M-k select-pane -D
bind-key -n M-i select-pane -U
bind-key -n M-l select-pane -R

# A pane in copy mode resolves keys against copy-mode-vi and never falls back to
# the root table, so mirror the pane navigation there to keep it working.
bind-key -T copy-mode-vi M-j select-pane -L
bind-key -T copy-mode-vi M-k select-pane -D
bind-key -T copy-mode-vi M-i select-pane -U
bind-key -T copy-mode-vi M-l select-pane -R

# Copy mode and clipboard-friendly selections.
bind-key -n M-Space copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -n M-y paste-buffer

# Emacs-style motion and marking inside copy mode, on the same i/j/k/l layout as
# the pane navigation above. A terminal sends 0x09 for ctrl+i and tmux resolves
# that to Tab unless extended keys are on, so bind both; Tab carries no default
# copy-mode binding. These override the default C-e scroll-down and C-v
# rectangle-toggle.
bind-key -T copy-mode-vi C-a send-keys -X start-of-line
bind-key -T copy-mode-vi C-e send-keys -X end-of-line
bind-key -T copy-mode-vi C-j send-keys -X cursor-left
bind-key -T copy-mode-vi C-k send-keys -X cursor-down
bind-key -T copy-mode-vi C-i send-keys -X cursor-up
bind-key -T copy-mode-vi Tab send-keys -X cursor-up
bind-key -T copy-mode-vi C-l send-keys -X cursor-right
bind-key -T copy-mode-vi M-b send-keys -X previous-word
bind-key -T copy-mode-vi M-f send-keys -X next-word
bind-key -T copy-mode-vi M-v send-keys -X page-up
bind-key -T copy-mode-vi C-v send-keys -X page-down
bind-key -T copy-mode-vi M-< send-keys -X history-top
bind-key -T copy-mode-vi M-> send-keys -X history-bottom
bind-key -T copy-mode-vi C-Space send-keys -X begin-selection
bind-key -T copy-mode-vi M-w send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi C-g send-keys -X clear-selection

bind-key r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
